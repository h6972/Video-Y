<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bài giảng</title>
<style>
@font-face{font-family:Inter;src:url("../../fonts/Inter-Regular.otf");font-weight:400}
@font-face{font-family:Inter;src:url("../../fonts/Inter-Medium.otf");font-weight:500}
@font-face{font-family:Inter;src:url("../../fonts/Inter-SemiBold.otf");font-weight:600}
@font-face{font-family:Inter;src:url("../../fonts/Inter-Bold.otf");font-weight:700}
@font-face{font-family:Inter;src:url("../../fonts/Inter-ExtraBold.otf");font-weight:800}
@font-face{font-family:Inter;src:url("../../fonts/Inter-Italic.otf");font-weight:400;font-style:italic}
:root{
  --bg:#07122a; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09); --line:rgba(255,255,255,.13);
  --tx:#f3f6fb; --mut:#a3b3cc; --dim:#6f82a3;
  --teal:#2dd4bf; --coral:#fb7185; --amber:#fbbf24; --green:#4ade80; --blue:#60a5fa; --violet:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{font-family:Inter,sans-serif;color:var(--tx)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#bg{position:absolute;inset:-200px;background:
  radial-gradient(900px 700px at 80% 15%,rgba(37,99,235,.35),transparent 60%),
  radial-gradient(800px 700px at 5% 95%,rgba(20,184,166,.22),transparent 60%),
  radial-gradient(600px 500px at 50% 50%,rgba(167,139,250,.08),transparent 70%)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:64px 64px}
#top{position:absolute;left:72px;right:72px;top:36px;display:flex;align-items:center;justify-content:space-between;z-index:5}
#series{font-size:22px;font-weight:600;color:var(--mut)} #series b{color:var(--teal);font-weight:800;letter-spacing:.5px}
#part{font-size:20px;font-weight:700;padding:8px 18px;border-radius:999px;background:var(--teal);color:#05221f}
#foot{position:absolute;left:72px;right:72px;bottom:16px;display:flex;justify-content:space-between;font-size:17px;color:rgba(255,255,255,.4);z-index:5}
#prog{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--teal),var(--blue));z-index:6}
#subs{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1600px;text-align:center;z-index:7;
  font-size:33px;line-height:1.32;font-weight:600;padding:12px 28px;border-radius:14px;background:rgba(2,6,18,.8);text-shadow:0 2px 6px rgba(0,0,0,.5)}
#subs:empty{display:none}

.scene{position:absolute;left:72px;right:72px;top:96px;bottom:160px}
.hdr{position:absolute;left:0;top:0;right:0}
.kick{font-size:21px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal)}
.ttl{font-size:50px;font-weight:800;letter-spacing:-.6px;margin-top:8px;line-height:1.12}
.ref{position:absolute;right:0;top:0;font-size:19px;font-weight:600;color:var(--mut);border:1px solid var(--line);padding:6px 14px;border-radius:10px}
.body{position:absolute;left:0;right:0;top:132px;bottom:0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:24px 30px;transition:none}
.hl{border-color:var(--c,var(--teal))!important;background:var(--card2)!important;box-shadow:0 0 0 1px var(--c,var(--teal)),0 0 34px -6px var(--c,var(--teal))}
.past{opacity:.72}
.mut{color:var(--mut)}
.c-teal{--c:var(--teal)} .c-coral{--c:var(--coral)} .c-amber{--c:var(--amber)} .c-green{--c:var(--green)} .c-blue{--c:var(--blue)} .c-violet{--c:var(--violet)}
.acc{color:var(--c,var(--teal))}
.tagc{display:inline-block;font-size:19px;font-weight:800;padding:5px 12px;border-radius:8px;background:color-mix(in srgb,var(--c,var(--teal)) 18%,transparent);color:var(--c,var(--teal));letter-spacing:.5px}
.n{flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;background:var(--c,var(--teal));color:#061226}
b,strong{font-weight:700} em{font-style:normal;color:var(--amber);font-weight:700}
.mlab{position:absolute;font-size:19px;font-weight:800;color:#fff;background:rgba(2,6,18,.78);border:2px solid var(--c);padding:3px 11px;border-radius:9px;white-space:nowrap;z-index:2}
.mcap{height:52px;margin-top:8px;text-align:center;line-height:1.25}.mcap b{display:block;font-size:22px}.mcap span{display:block;font-size:15px;color:var(--mut);margin-top:3px}
.cdw{position:absolute;right:0;bottom:6px;width:240px;display:flex;flex-direction:column;align-items:center;opacity:0;z-index:4;pointer-events:none}
.cdw svg{filter:drop-shadow(0 0 18px rgba(251,191,36,.35))}
.cdb{fill:rgba(2,6,18,.82);stroke:rgba(255,255,255,.14);stroke-width:10}
.cdr{fill:none;stroke:var(--amber);stroke-width:10;stroke-linecap:round}
.cdn{position:absolute;top:0;width:168px;height:168px;display:flex;align-items:center;justify-content:center;font-size:76px;font-weight:800;color:var(--amber)}
.cdt{margin-top:10px;font-size:20px;font-weight:700;color:var(--mut);letter-spacing:.3px;white-space:nowrap}
/* title */
.t-title .big{font-size:76px;font-weight:800;line-height:1.08;letter-spacing:-1.5px}
/* list */
.lst{display:grid;gap:22px;height:100%;grid-auto-rows:1fr}
.li{display:flex;gap:24px;align-items:center;padding:24px 32px}
.li .tx{font-size:35px;font-weight:700;line-height:1.28}
.dense{gap:16px}.dense .li{padding:14px 26px}.dense .li .tx{font-size:30px}.dense .li .ds{font-size:23px;margin-top:4px}
.li .ds{font-size:27px;color:var(--mut);margin-top:8px;line-height:1.4;font-weight:500}
/* timeline */
.tl{position:absolute;left:0;right:0;top:204px;height:6px;background:var(--line);border-radius:3px}
.tlf{position:absolute;left:0;top:204px;height:6px;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:3px}
.ev{position:absolute;top:0;width:290px;text-align:center}
.ev .yr{font-size:52px;font-weight:800}
.ev .dot{width:30px;height:30px;border-radius:50%;margin:18px auto;background:var(--bg);border:6px solid var(--c,var(--teal))}
.ev .et{font-size:29px;font-weight:700;line-height:1.25}
.ev .ed{font-size:23px;color:var(--mut);margin-top:8px;line-height:1.35}
/* table */
.tbl{display:grid;gap:14px;height:100%}
.tr{display:grid;gap:14px;align-items:stretch}
.th{font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:0 22px;color:var(--mut)}
.td{font-size:22px;line-height:1.34;padding:16px 22px;display:flex;flex-direction:column;justify-content:center;border-radius:16px;background:var(--card);border:1.5px solid var(--line)}
.td b{font-size:24px}
.op{font-size:30px;font-weight:800;text-align:center;color:var(--amber);margin:18px 0}
.ans{font-size:31px;font-weight:700;line-height:1.4}
/* video dọc 1080x1920 (TikTok/Reels/Shorts): "format": "vertical" */
body[data-format=vertical] #stage{width:1080px;height:1920px}
body[data-format=vertical] #top{left:56px;right:56px;top:70px;flex-direction:column;align-items:flex-start;gap:14px}
body[data-format=vertical] #series{font-size:24px}
body[data-format=vertical] #part{font-size:24px}
body[data-format=vertical] .scene{left:56px;right:56px;top:250px;bottom:520px}
body[data-format=vertical] .ttl{font-size:60px;line-height:1.1}
body[data-format=vertical] .kick{font-size:25px}
body[data-format=vertical] .ref{display:none}
body[data-format=vertical] .body{top:190px}
body[data-format=vertical] #subs{bottom:300px;max-width:968px;width:968px;font-size:42px;line-height:1.3;padding:16px 26px}
body[data-format=vertical] #foot{left:56px;right:56px;bottom:60px;font-size:22px;flex-direction:column;gap:6px}
body[data-format=vertical] .lst{grid-template-columns:1fr!important}
body[data-format=vertical] .li .tx{font-size:40px}
body[data-format=vertical] .li .ds{font-size:31px}
body[data-format=vertical] .qopts{grid-template-columns:1fr 1fr!important}
body[data-format=vertical] .cgrid{grid-template-columns:1fr!important;height:auto!important}
body[data-format=vertical] .cdw{bottom:-40px}
body[data-format=vertical] .l-quiz .body,body[data-format=vertical] .l-box .body{zoom:1.22}
body[data-format=vertical] .l-gauge .body{zoom:1.18}
.hook{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}
.hook .hq{font-size:84px;font-weight:800;line-height:1.08;letter-spacing:-1px}
.hook .hs{font-size:40px;font-weight:700;margin-top:34px;line-height:1.3}
</style>
<style>/*__THEME_CSS__*/</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="grid"></div>
  <div id="top"><div id="series"></div><div id="part"></div></div>
  <div id="scenes"></div>
  <div id="subs"></div>
  <div id="foot"><span id="src"></span><span id="sign"></span></div>
  <div id="prog"></div>
</div>
<script>
const TL = /*__TIMELINE__*/null;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=p=>1-Math.pow(1-clamp(p),3);
const esc=s=>String(s??'');           // nội dung do Claude soạn, cho phép <b>/<em>
const at=v=>v==null?'0':(typeof v==='number'?'L'+v:v);
const C=c=>'c-'+(c||'teal');

const VERT=TL.format==='vertical'; document.body.dataset.format=VERT?'vertical':'wide';
document.getElementById('series').innerHTML=`<b>${esc(TL.series||'VIDEO Y KHOA')}</b>  ·  ${esc(TL.subtitle||'')}`;
document.getElementById('part').textContent=TL.part||'';
document.getElementById('src').textContent=TL.source_short||'';
document.getElementById('sign').textContent=TL.sign||'';

/* ---------- các layout ---------- */
const L={
 title:s=>`<svg style="position:absolute;right:-20px;top:120px" width="760" height="620" viewBox="0 0 760 620">
   ${s.art==='thyroid'?`<path d="M380 80 V560" stroke="rgba(148,163,184,.35)" stroke-width="44" stroke-linecap="round" data-a="draw" data-in="0.2"/>
   <path d="M380 80 V560" stroke="rgba(148,163,184,.25)" stroke-width="44" stroke-dasharray="6 26" data-a="draw" data-in="0.3"/>
   <path d="M352 300 C330 210 300 150 255 150 C205 150 180 230 190 320 C200 410 240 470 290 470 C335 470 350 410 352 360 Z" fill="rgba(251,113,133,.13)" stroke="rgba(251,113,133,.85)" stroke-width="5" data-a="draw" data-in="0.5"/>
   <path d="M408 300 C430 210 460 150 505 150 C555 150 580 230 570 320 C560 410 520 470 470 470 C425 470 410 410 408 360 Z" fill="rgba(251,113,133,.13)" stroke="rgba(251,113,133,.85)" stroke-width="5" data-a="draw" data-in="0.7"/>
   <path d="M350 335 C365 352 395 352 410 335 L410 372 C395 388 365 388 350 372 Z" fill="rgba(251,113,133,.25)" stroke="rgba(251,113,133,.85)" stroke-width="4" data-a="draw" data-in="0.9"/>
   <path d="M120 250 C100 215 135 195 120 160 M640 250 C660 215 625 195 640 160 M90 400 C70 365 105 345 90 310 M670 400 C690 365 655 345 670 310" fill="none" stroke="rgba(251,191,36,.75)" stroke-width="5" stroke-linecap="round" data-a="draw" data-in="1.2"/>
   <path d="M0 590 H120 L140 560 L160 590 H190 L205 610 L228 470 L250 680 L268 590 H300 L320 560 L340 590 H370 L385 610 L408 470 L430 680 L448 590 H480 L500 560 L520 590 H550 L565 610 L588 470 L610 680 L628 590 H760" fill="none" stroke="rgba(96,165,250,.85)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-a="draw" data-in="1.5"/>`:s.art==='sepsis'?`<path d="M380 110 C330 200 230 290 230 390 C230 475 298 540 380 540 C462 540 530 475 530 390 C530 290 430 200 380 110 Z" fill="rgba(251,113,133,.12)" stroke="rgba(251,113,133,.75)" stroke-width="5" data-a="draw" data-in="0.3"/>
   <circle cx="300" cy="420" r="13" fill="rgba(45,212,191,.2)" stroke="#2dd4bf" stroke-width="3" data-a="pop" data-in="0.9"/>
   <circle cx="455" cy="455" r="10" fill="rgba(45,212,191,.2)" stroke="#2dd4bf" stroke-width="3" data-a="pop" data-in="1.0"/>
   <circle cx="400" cy="300" r="9" fill="rgba(45,212,191,.2)" stroke="#2dd4bf" stroke-width="3" data-a="pop" data-in="1.1"/>
   <rect x="330" y="340" width="44" height="18" rx="9" transform="rotate(-35 352 349)" fill="rgba(251,191,36,.18)" stroke="rgba(251,191,36,.85)" stroke-width="3" data-a="pop" data-in="1.2"/>
   <rect x="410" y="380" width="44" height="18" rx="9" transform="rotate(25 432 389)" fill="rgba(251,191,36,.18)" stroke="rgba(251,191,36,.85)" stroke-width="3" data-a="pop" data-in="1.3"/>
   <rect x="350" y="470" width="40" height="16" rx="8" transform="rotate(70 370 478)" fill="rgba(251,191,36,.18)" stroke="rgba(251,191,36,.85)" stroke-width="3" data-a="pop" data-in="1.4"/>
   <path d="M0 600 H230 L255 570 L280 600 H310 L330 630 L360 470 L390 690 L415 600 H760" fill="none" stroke="rgba(96,165,250,.85)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" data-a="draw" data-in="1.5"/>`:s.art==='lungs'?`<path d="M380 120 V300 M380 300 C350 320 320 330 300 350 M380 300 C410 320 440 330 460 350" fill="none" stroke="rgba(148,163,184,.7)" stroke-width="10" stroke-linecap="round" data-a="draw" data-in="0.3"/>
   <path d="M330 170 C260 160 190 240 175 330 C160 420 180 500 240 510 C300 520 345 470 350 400 C355 330 360 230 330 170 Z" fill="rgba(45,212,191,.10)" stroke="rgba(45,212,191,.75)" stroke-width="4" data-a="draw" data-in="0.5"/>
   <path d="M430 170 C500 160 570 240 585 330 C600 420 580 500 520 510 C460 520 415 470 410 400 C405 330 400 230 430 170 Z" fill="rgba(45,212,191,.10)" stroke="rgba(45,212,191,.75)" stroke-width="4" data-a="draw" data-in="0.7"/>
   <path d="M300 350 C270 380 250 410 240 450 M300 350 C300 390 295 430 285 470 M460 350 C490 380 510 410 520 450 M460 350 C460 390 465 430 475 470" fill="none" stroke="rgba(251,113,133,.6)" stroke-width="4" stroke-linecap="round" data-a="draw" data-in="1.1"/>
   <path d="M0 580 H200 L225 550 L250 580 H560 L585 550 L610 580 H760" fill="none" stroke="rgba(96,165,250,.8)" stroke-width="5" stroke-linecap="round" data-a="draw" data-in="1.4"/>`:s.art==='pancreas'?`<path d="M250 150 C150 160 105 260 135 360 C160 445 240 480 305 455" fill="none" stroke="rgba(251,191,36,.55)" stroke-width="26" stroke-linecap="round" data-a="draw" data-in="0.3"/>
   <path d="M175 300 C155 250 185 205 245 208 C305 212 335 232 385 226 C455 218 525 180 595 168 C640 162 660 186 640 210 C612 244 542 258 472 273 C412 286 362 304 322 334 C292 358 300 402 268 422 C228 447 185 402 175 360 Z" fill="rgba(251,113,133,.10)" stroke="rgba(251,113,133,.65)" stroke-width="4" data-a="draw" data-in="0.5"/>
   <path d="M205 345 C255 300 330 262 405 250 C475 239 545 214 615 190" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 0" data-a="draw" data-in="1.0"/>
   <circle cx="560" cy="210" r="34" fill="rgba(251,113,133,.18)" stroke="rgba(251,113,133,.8)" stroke-width="3" data-a="pop" data-in="1.4"/>
   <circle cx="470" cy="255" r="22" fill="rgba(251,191,36,.15)" stroke="rgba(251,191,36,.8)" stroke-width="3" data-a="pop" data-in="1.6"/>`:`<defs><linearGradient id="ecg" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset=".3" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs>
   <path d="M150 230 C150 140 270 110 330 190 C390 110 510 140 510 230 C510 340 330 450 330 450 C330 450 150 340 150 230Z" fill="rgba(251,113,133,.08)" stroke="rgba(251,113,133,.5)" stroke-width="3" data-a="draw" data-in="0.4"/>
   <path d="M0 330 H190 L215 300 L240 330 H270 L290 360 L320 170 L350 410 L375 330 H420 L460 290 L500 330 H760" fill="none" stroke="url(#ecg)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-a="draw" data-in="0.8"/>`}
   </svg>
   <div class="t-title" style="position:absolute;left:0;top:120px;width:1250px">
   <div class="kick" data-in="0.2">${esc(s.kicker)}</div>
   <div class="big" style="margin-top:22px" data-in="0.5">${esc(s.title)}</div>
   <div style="font-size:40px;font-weight:700;margin-top:22px" class="acc" data-in="1.0">${esc(s.subtitle||'')}</div>
   <div style="display:flex;gap:14px;margin-top:40px;flex-wrap:wrap">${(s.badges||[]).map((b,i)=>`<span class="tagc ${C(b.c)}" style="font-size:24px;padding:8px 16px" data-in="${at(b.at??(1.4+i*0.3))}">${esc(b.t)}</span>`).join('')}</div>
   <div class="mut" style="font-size:24px;margin-top:40px;line-height:1.5" data-in="${at(s.note_at??1.8)}">${esc(s.note||'')}</div></div>`,

 list:s=>{const two=(s.items||[]).length>(s.cols1||5);
   return `<div class="lst ${s.dense||(s.items||[]).length>6?'dense':''}" style="grid-template-columns:${two?'1fr 1fr':'1fr'}">${s.items.map((it,i)=>`
   <div class="card li ${C(it.c||s.c)}" data-in="${at(it.at)}" data-a="left" data-hl="${at(it.at)}${it.hl?','+it.hl:''}">
     ${s.numbered===false?`<div class="n" style="width:20px;height:20px;margin-top:12px"></div>`:`<div class="n">${it.n??i+1}</div>`}
     <div><div class="tx">${esc(it.t)}</div>${it.d?`<div class="ds">${esc(it.d)}</div>`:''}</div></div>`).join('')}</div>`},

 timeline:s=>{const n=s.events.length, w=1776/n;
   return `<div class="tl"></div><div class="tlf" data-a="growx" data-in="${at(s.events[0].at)}" data-to="${at(s.events[n-1].at)}" style="width:0"></div>
   ${s.events.map((e,i)=>`<div class="ev ${C(e.c)}" style="left:${i*w+w/2-145}px;top:${110}px" data-in="${at(e.at)}" data-hl="${at(e.at)}">
     <div class="yr acc">${esc(e.year)}</div><div class="dot"></div><div class="et">${esc(e.t)}</div><div class="ed">${esc(e.d||'')}</div></div>`).join('')}
   ${s.note?`<div class="card ${C(s.note.c||'amber')}" style="position:absolute;left:0;right:0;bottom:0" data-in="${at(s.note.at)}" data-hl="${at(s.note.at)}"><div style="font-size:27px;font-weight:600;line-height:1.4">${esc(s.note.t)}</div></div>`:''}`},

 formula:s=>`<div class="card ${C(s.main.c)}" data-in="${at(s.main.at)}" data-a="pop" data-hl="${at(s.main.at)}${s.main.hl?','+s.main.hl:''}">
     <div class="tagc ${C(s.main.c)}">${esc(s.main.tag||'')}</div>
     <div style="font-size:44px;font-weight:800;margin-top:12px">${esc(s.main.t)}</div>
     <div class="mut" style="font-size:30px;margin-top:10px;line-height:1.4">${esc(s.main.d||'')}</div></div>
   <div class="op" data-in="${at(s.op_at??s.options[0].at)}">${esc(s.op||'VÀ ≥ 1 trong các tiêu chí sau')}</div>
   <div style="display:grid;grid-template-columns:repeat(${s.options.length},1fr);gap:22px;height:330px">
   ${s.options.map((o,i)=>`<div class="card ${C(o.c)}" data-in="${at(o.at)}" data-a="up" data-hl="${at(o.at)}">
     <div class="n" style="margin-bottom:16px">${i+1}</div><div style="font-size:33px;font-weight:700;line-height:1.28">${esc(o.t)}</div>
     <div class="mut" style="font-size:26px;margin-top:12px;line-height:1.42">${esc(o.d||'')}</div></div>`).join('')}</div>`,

 cards:s=>`<div class="cgrid" style="display:grid;grid-template-columns:repeat(${s.cards.length},1fr);gap:24px;height:${s.h||640}px">
   ${s.cards.map((c,i)=>`<div class="card ${C(c.c)}" style="display:flex;flex-direction:column" data-in="${at(c.at)}" data-a="up" data-hl="${at(c.at)}${c.hl?','+c.hl:''}">
     <div class="tagc ${C(c.c)}">${esc(c.tag||'')}</div>
     <div style="font-size:41px;font-weight:800;margin-top:14px;line-height:1.15" class="acc">${esc(c.t)}</div>
     <div style="font-size:29px;font-weight:600;margin-top:16px;line-height:1.4">${esc(c.d||'')}</div>
     ${(c.items||[]).map(x=>`<div style="font-size:26px;color:var(--mut);margin-top:12px;line-height:1.4;display:flex;gap:10px"><span class="acc">▸</span><span>${esc(x)}</span></div>`).join('')}
     </div>`).join('')}</div>`,

 compare:s=>{const g=s.widths||'1fr 1.3fr 1fr';
   return `<div class="tbl" style="grid-template-rows:auto repeat(${s.rows.length},1fr)"><div class="tr" style="grid-template-columns:${g}" data-in="0.3">${s.head.map((h,i)=>`<div class="th" style="${i===1?'color:var(--teal)':''}">${esc(h)}</div>`).join('')}</div>
   ${s.rows.map(r=>`<div class="tr" style="grid-template-columns:${g}" data-in="${at(r.at)}" data-a="left">${r.cells.map((c,i)=>`<div class="td ${C(i===1?(r.c||'teal'):'blue')}" ${i===1?`data-hl="${at(r.at)}${r.hl?','+r.hl:''}"`:''} style="${i===2?'color:var(--mut)':''}"><div>${esc(c)}</div></div>`).join('')}</div>`).join('')}</div>`},

 box:s=>`<div class="card ${C(s.box.c)}" style="border-width:2px" data-in="${at(s.box.at)}" data-a="pop" data-hl="${at(s.box.at)}">
     <div class="tagc ${C(s.box.c)}">${esc(s.box.tag)}</div>
     <div style="font-size:${s.box.size||38}px;font-weight:700;margin-top:14px;line-height:1.42">${esc(s.box.t)}</div></div>
   <div style="display:grid;grid-template-columns:repeat(${Math.min((s.notes||[]).length,3)||1},1fr);gap:24px;margin-top:28px;min-height:${s.notes_h||300}px">
   ${(s.notes||[]).map(n=>`<div class="card ${C(n.c)}" data-in="${at(n.at)}" data-a="up" data-hl="${at(n.at)}"><div class="tagc ${C(n.c)}">${esc(n.tag||'')}</div><div style="font-size:30px;font-weight:600;margin-top:14px;line-height:1.42">${esc(n.t)}</div></div>`).join('')}</div>`,

 quiz:s=>`<div class="card c-blue" data-in="${at(s.case_at??0)}"><div class="tagc c-blue">TÌNH HUỐNG</div>
     <div style="font-size:31px;font-weight:600;margin-top:14px;line-height:1.45">${esc(s.case)}</div></div>
   <div style="font-size:38px;font-weight:800;margin:30px 0 20px" data-in="${at(s.q_at??0)}">${esc(s.q)}</div>
   <div class="qopts" style="display:grid;grid-template-columns:repeat(${s.options.length},1fr);gap:18px">
   ${s.options.map((o,i)=>`<div class="card ${i===s.answer?'c-green':'c-coral'}" data-in="${at(s.q_at??0)}+${0.3+i*0.25}" data-a="up" ${i===s.answer?`data-hl="${at(s.answer_at)}+" data-mark="${at(s.answer_at)}"`:`data-dim="${at(s.answer_at)}"`}>
     <div style="font-size:30px;font-weight:700">${String.fromCharCode(65+i)}. ${esc(o)}</div></div>`).join('')}</div>
   <div class="card c-green" style="margin-top:22px" data-in="${at(s.explain_at??s.answer_at)}" data-a="up"><div class="ans"><span class="acc">Đáp án ${String.fromCharCode(65+s.answer)}.</span> ${esc(s.explain)}</div></div>`,
};
L.summary=L.list;
L.hook=s=>`<div class="hook"><div class="kick" data-in="0">${esc(s.kicker||'')}</div><div class="hq" style="margin-top:20px" data-in="0.1" data-a="pop">${esc(s.hook)}</div><div class="hs acc ${C(s.c||'amber')}" data-in="${at(s.sub_at??0.6)}">${esc(s.sub||'')}</div></div>`;

/* ---------- media: ảnh / clip thật + chú thích động ---------- */
L.media=s=>{
 const P=s.panels||[], N=s.notes||[], gap=22, H=s.h||692;
 const nw=N.length?(s.notes_w||500):0, W=1776-(nw?nw+gap:0);
 const tw=P.reduce((a,p)=>a+(p.flex||1),0);
 const pan=P.map(p=>{
   const pw=(W-gap*(P.length-1))*(p.flex||1)/tw, capH=(p.cap||p.credit)?62:0, ah=H-capH-20, ar=p.ar||1.4;
   let bw=pw-20, bh=bw/ar; if(bh>ah){bh=ah;bw=bh*ar;}
   const X=v=>v*bw/100, Y=v=>v*bh/100;
   const img=p.seq?`<div data-seq="${p.n}" data-fps="${p.fps||25}" style="position:absolute;inset:0">${Array.from({length:p.n},(_,k)=>`<img src="${p.seq.replace('%03d',String(k).padStart(3,'0'))}" style="position:absolute;inset:0;width:100%;height:100%;visibility:${k?'hidden':'visible'}">`).join('')}</div>`
                 :`<img src="${p.src}" style="position:absolute;inset:0;width:100%;height:100%">`;
   const mk=(p.marks||[]).map(m=>{const c=`var(--${m.c||'amber'})`, tin=at(m.at);
     if(m.type==='label') return '';
     if(m.type==='circle') return `<ellipse cx="${X(m.x)}" cy="${Y(m.y)}" rx="${X(m.r)}" ry="${X(m.ry||m.r)}" fill="none" stroke="${c}" stroke-width="4" data-a="draw" data-in="${tin}"/>`;
     if(m.type==='box') return `<rect x="${X(m.x)}" y="${Y(m.y)}" width="${X(m.w)}" height="${Y(m.h)}" rx="10" fill="none" stroke="${c}" stroke-width="4" data-a="draw" data-in="${tin}"/>`;
     if(m.type==='line'){const x1=X(m.x),y1=Y(m.y),x2=X(m.x2),y2=Y(m.y2),a=Math.atan2(y2-y1,x2-x1),nx=-Math.sin(a)*9,ny=Math.cos(a)*9;
       return `<g data-in="${tin}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="4" stroke-dasharray="${m.dash?'10 6':''}"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x1+nx}" y2="${y1+ny}" stroke="${c}" stroke-width="4"/><line x1="${x2-nx}" y1="${y2-ny}" x2="${x2+nx}" y2="${y2+ny}" stroke="${c}" stroke-width="4"/></g>`;}
     const x2=X(m.x),y2=Y(m.y),x1=X(m.x+(m.dx??-14)),y1=Y(m.y+(m.dy??-14)),a=Math.atan2(y2-y1,x2-x1),L2=18;
     const hx=x2-Math.cos(a)*L2, hy=y2-Math.sin(a)*L2;
     return `<g data-in="${tin}" data-a="pop"><line x1="${x1}" y1="${y1}" x2="${hx}" y2="${hy}" stroke="${c}" stroke-width="5" stroke-linecap="round"/><polygon points="${x2},${y2} ${hx-Math.sin(a)*10},${hy+Math.cos(a)*10} ${hx+Math.sin(a)*10},${hy-Math.cos(a)*10}" fill="${c}"/></g>`;
   }).join('');
   const lb=(p.marks||[]).filter(m=>m.t).map(m=>{let lx=m.lx,ly=m.ly;
     if(lx==null){ if(m.type==='label'){lx=m.x;ly=m.y;} else if(m.type==='arrow'||!m.type){lx=m.x+(m.dx??-14);ly=m.y+(m.dy??-14);} else if(m.type==='line'){lx=(m.x+m.x2)/2;ly=(m.y+m.y2)/2-6;} else if(m.type==='box'){lx=m.x+m.w/2;ly=m.y-5;} else {lx=m.x;ly=m.y+(m.ry||m.r)*ar+6;} }
     const lw=String(m.t).length*11+26, L0=m.anchor?X(lx):Math.max(4,Math.min(bw-lw-4,X(lx)-lw/2)), T0=Math.max(20,Math.min(bh-20,Y(ly)));
     return `<div class="mlab c-${m.c||'amber'}" style="left:${L0}px;top:${T0}px;transform:translate(${m.anchor||'0,-50%'})" data-in="${at(m.at)}">${esc(m.t)}</div>`;}).join('');
   const z=p.zoom?`data-zoom="${p.zoom.s||1.6}" data-zin="${at(p.zoom.at)}" ${p.zoom.out!=null?`data-zout="${at(p.zoom.out)}"`:''}`:'';
   return `<div class="card mp" style="width:${pw}px;height:${H}px;padding:10px;display:flex;flex-direction:column;align-items:center" data-in="${at(p.at)}" data-a="pop">
     <div style="flex:1;display:flex;align-items:center;justify-content:center;width:100%"><div style="position:relative;width:${bw}px;height:${bh}px;overflow:hidden;border-radius:12px;background:#000">
     <div class="mz" ${z} style="position:absolute;inset:0;transform-origin:${p.zoom?p.zoom.x:50}% ${p.zoom?p.zoom.y:50}%">${img}<svg width="${bw}" height="${bh}" style="position:absolute;left:0;top:0;overflow:visible">${mk}</svg>${lb}</div></div></div>
     ${capH?`<div class="mcap"><b>${esc(p.cap||'')}</b><span>${esc(p.credit||'')}</span></div>`:''}</div>`;}).join('');
 const nt=nw?`<div style="width:${nw}px;display:flex;flex-direction:column;gap:14px">${N.map(n=>`<div class="card ${C(n.c)}" style="flex:1;padding:16px 22px;display:flex;flex-direction:column;justify-content:center" data-in="${at(n.at)}" data-a="left" data-hl="${at(n.at)}${n.hl?','+n.hl:''}">${n.tag?`<div><span class="tagc ${C(n.c)}">${esc(n.tag)}</span></div>`:''}<div style="font-size:26px;font-weight:700;margin-top:6px;line-height:1.28">${esc(n.t)}</div>${n.d?`<div class="mut" style="font-size:21px;margin-top:5px;line-height:1.35">${esc(n.d)}</div>`:''}</div>`).join('')}</div>`:'';
 return `<div style="display:flex;gap:${gap}px;height:${H}px"><div style="display:flex;gap:${gap}px;width:${W}px">${pan}</div>${nt}</div>`;
};
document.body.dataset.theme=TL.theme||'guideline';
/*__THEME_JS__*/

/* ---------- dựng các cảnh ---------- */
const root=document.getElementById('scenes');
TL.scenes.forEach(sc=>{
  const el=document.createElement('section'); el.className='scene l-'+sc.layout; el.id=sc.id;
  const NOH=['title','hook','brand','endscreen'].includes(sc.layout); const hdr=NOH?'':`<div class="hdr"><div class="kick" data-in="0">${esc(sc.chapter)}</div><div class="ttl" data-in="0.15">${esc(sc.title)}</div>${sc.ref?`<div class="ref" data-in="0.4">${esc(sc.ref)}</div>`:''}</div>`;
  el.innerHTML=hdr+`<div class="body" ${NOH?'style="top:0"':''}>${(L[sc.layout]||L.list)(sc)}</div>`;
  if(sc.cd) el.insertAdjacentHTML('beforeend',`<div class="cdw"><svg width="168" height="168" viewBox="0 0 168 168"><circle cx="84" cy="84" r="72" class="cdb"/><circle cx="84" cy="84" r="72" class="cdr" transform="rotate(-90 84 84)" stroke-dasharray="452.4"/></svg><div class="cdn"></div><div class="cdt">Tạm dừng để suy nghĩ</div></div>`);
  root.appendChild(el);
});

function parseT(v,sc){ if(v==null||v==='') return null; v=String(v).trim();
  const m=v.match(/^L(\d+)([+-][\d.]*)?$/);
  if(m){const ln=sc.L[Math.min(+m[1],sc.L.length-1)]; const off=m[2]?(m[2].length>1?parseFloat(m[2]):0):0; return ln.t0+off;}
  return parseFloat(v); }
function lineRange(v,sc){ // "L3" -> [t0,t1] ; "L3+" -> [t0, end of scene]
  v=String(v).trim(); const m=v.match(/^L(\d+)(\+)?([\d.]+)?$/); if(!m) return null;
  const ln=sc.L[Math.min(+m[1],sc.L.length-1)];
  if(m[3]) return [ln.t0+parseFloat(m[3]), ln.t1+0.3];
  return [ln.t0, m[2]?sc.dur:ln.t1+0.3]; }

const scenes=TL.scenes.map(sc=>{const el=document.getElementById(sc.id);
  const items=[...el.querySelectorAll('[data-in]')].map(e=>{
    const v=e.dataset.in; let tin; const mm=v.match(/^(L\d+)\+([\d.]+)$/); tin=mm?parseT(mm[1],sc)+parseFloat(mm[2]):parseT(v,sc);
    const o={e,tin,a:e.dataset.a||'fade',to:e.dataset.to?parseT(e.dataset.to,sc):null};
    if(o.a==='draw'&&e.getTotalLength){o.len=e.getTotalLength();e.style.strokeDasharray=o.len+2;}
    return o;});
  const hls=[...el.querySelectorAll('[data-hl]')].map(e=>({e,r:e.dataset.hl.split(',').map(x=>lineRange(x,sc)).filter(Boolean)}));
  const dims=[...el.querySelectorAll('[data-dim]')].map(e=>({e,t:parseT(e.dataset.dim,sc)}));
  const seqs=[...el.querySelectorAll('[data-seq]')].map(e=>({imgs:[...e.children],n:+e.dataset.seq,fps:+e.dataset.fps,k:0}));
  const zooms=[...el.querySelectorAll('[data-zoom]')].map(e=>({e,s:+e.dataset.zoom,tin:parseT(e.dataset.zin,sc),tout:e.dataset.zout?parseT(e.dataset.zout,sc):null}));
  const cdw=el.querySelector('.cdw');
  return {sc,el,items,hls,dims,seqs,zooms,cd:cdw?{w:cdw,r:cdw.querySelector('.cdr'),n:cdw.querySelector('.cdn')}:null};});

function render(t){
  let sub='', cur=0;
  scenes.forEach((S,idx)=>{
    const {sc,el}=S, lt=t-sc.start;
    if(t>=sc.start) cur=idx;
    if(lt<-0.01||lt>=sc.dur){el.style.display='none';return;}
    el.style.display='block';
    el.style.opacity=Math.min(ease(lt/0.45), idx<scenes.length-1?ease((sc.dur-lt)/0.4):1);
    for(const it of S.items){const e=it.e, p=ease((lt-it.tin)/0.55);
      switch(it.a){
        case 'draw': e.style.strokeDashoffset=it.len*(1-ease((lt-it.tin)/1.6)); e.style.opacity=lt>=it.tin?1:0; break;
        case 'left': e.style.opacity=p; e.style.transform=`translateX(${(1-p)*-50}px)`; break;
        case 'up': e.style.opacity=p; e.style.transform=`translateY(${(1-p)*40}px)`; break;
        case 'pop': e.style.opacity=p; e.style.transform=`scale(${0.92+0.08*p})`; break;
        case 'growx': {const q=it.to!=null?clamp((lt-it.tin)/Math.max(0.5,it.to-it.tin+0.6)):p; e.style.width=(100*ease(q))+'%'; break;}
        default: e.style.opacity=p; e.style.transform=`translateY(${(1-p)*20}px)`;
      }}
    let anyHl=false;
    for(const h of S.hls){const on=h.r.some(([a,b])=>lt>=a&&lt<b); h.e.classList.toggle('hl',on); if(on) anyHl=true;}
    for(const h of S.hls){h.e.classList.toggle('past',anyHl&&!h.e.classList.contains('hl')&&sc.layout!=='quiz');}
    for(const q of S.seqs){const k=Math.floor(Math.max(0,lt)*q.fps)%q.n; if(k!==q.k){q.imgs[q.k].style.visibility='hidden';q.imgs[k].style.visibility='visible';q.k=k;}}
    for(const z of S.zooms){let p=ease((lt-z.tin)/1.4); if(z.tout!=null) p*=1-ease((lt-z.tout)/1.2); z.e.style.transform=`scale(${1+(z.s-1)*p})`;}
    for(const d of S.dims){d.e.style.opacity=lt>=d.t?0.35:d.e.style.opacity;}
    if(S.cd){const c=sc.cd, q=lt-c.t0, on=q>=0&&q<c.s+0.3; S.cd.w.style.opacity=on?Math.min(1,q/0.3,(c.s+0.3-q)/0.3):0;
      if(on){const left=Math.max(0,c.s-q); S.cd.n.textContent=Math.ceil(left-1e-6)||''; S.cd.r.style.strokeDashoffset=452.4*(1-left/c.s);
        S.cd.w.style.transform=`scale(${1+0.05*Math.max(0,1-((q%1)/0.25))})`;}}
    for(const ln of sc.L) for(const s of ln.subs) if(lt>=s.t0&&lt<s.t1+0.25) sub=s.text;
  });
  if(window.COMMON_TICK) window.COMMON_TICK(t,cur,scenes);
  if(window.THEME_TICK) window.THEME_TICK(t,cur,scenes);
  document.getElementById('subs').textContent=sub;
  const br=!!(scenes[cur]&&scenes[cur].sc._brand); for(const id of ['top','foot','prog']) document.getElementById(id).style.visibility=br?'hidden':'visible';
  document.getElementById('prog').style.width=(clamp(t/TL.total)*100)+'%';
  document.getElementById('bg').style.transform=`translate(${Math.sin(t*0.05)*60}px,${Math.cos(t*0.04)*40}px)`;
}
window.render=render; window.TOTAL=TL.total; window.FONTS_READY=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>0))]).then(()=>true);
if(!location.search.includes('capture')){const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%TL.total);requestAnimationFrame(loop)})();}
</script>
