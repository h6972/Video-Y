name: Render video

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Tên thư mục dự án trong projects/ (vd: cum-nature-2026)"
        required: true
        default: "cum-nature-2026"
  push:
    branches: [main]
    paths: ["projects/**/script.json", "projects/**/template.html", "projects/**/audio/**"]

permissions:
  contents: write


jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Chọn dự án
        id: p
        run: |
          P="${{ github.event.inputs.project }}"
          if [ -z "$P" ]; then
            P=$(git diff --name-only HEAD~1 HEAD -- projects | cut -d/ -f2 | sort -u | head -1)
          fi
          [ -d "projects/$P" ] || { echo "Không thấy projects/$P"; exit 1; }
          echo "project=$P" >> "$GITHUB_OUTPUT"
          echo "Dự án: $P"

      - name: Chọn bộ giọng đọc
        id: t
        run: |
          T=$(python -c "import json;print(json.load(open('projects/${{ steps.p.outputs.project }}/script.json')).get('tts','edge'))")
          echo "tts=$T" >> "$GITHUB_OUTPUT"; echo "Bộ giọng đọc: $T"
          if [ "$T" = "omni" ] && ! ls projects/${{ steps.p.outputs.project }}/audio/*.flac >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::Chờ giọng OmniVoice — chạy tao-giong.bat ${{ steps.p.outputs.project }} trên máy"
          fi

      - name: Kiểm tra key Azure
        if: steps.t.outputs.tts == 'azure'
        env:
          K: ${{ secrets.AZURE_SPEECH_KEY }}
          R: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          if [ -z "$K" ] || [ -z "$R" ]; then
            echo "::error::Chưa khai báo secret AZURE_SPEECH_KEY / AZURE_SPEECH_REGION (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.t.outputs.skip != '1'
        with:
          python-version: "3.12"

      - name: Cài công cụ
        if: steps.t.outputs.skip != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q azure-cognitiveservices-speech edge-tts playwright
          pip install -q vieneu soundfile "onnxruntime==1.22.1"
          python -m playwright install --with-deps chromium

      - name: Giọng đọc → dựng hình → ghép tiếng
        if: steps.t.outputs.skip != '1'
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee "$RUNNER_TEMP/run.log") 2>&1
          D=projects/${{ steps.p.outputs.project }}
          python engine/build.py "$D"          # sinh SSML
          case "${{ steps.t.outputs.tts }}" in
            azure) python engine/tts_azure.py "$D" ;;
            vieneu) rm -rf "$D/audio"; python engine/tts_vieneu.py "$D" ;;
            gemini)
              P=${{ steps.p.outputs.project }}
              if git fetch -q --depth 1 origin logs 2>/dev/null && git show FETCH_HEAD:"$P-audio-do-dang.zip" > /tmp/do-dang.zip 2>/dev/null; then
                (cd "$D" && unzip -oq /tmp/do-dang.zip) && echo "Dùng lại giọng đã đọc ở lần trước"
              fi
              python engine/tts_gemini.py "$D" ;;
            omni)  ls "$D"/audio/*.flac >/dev/null 2>&1 || { echo "Chưa có giọng OmniVoice: chạy tao-giong.bat trên máy"; exit 1; } ;;
            *)     python engine/tts_edge.py "$D" ;;
          esac
          python engine/build.py "$D"          # căn thời lượng theo giọng thật
          python engine/capture.py "$D" video  # dựng hình 1920x1080
          python engine/mux.py "$D"            # ghép tiếng → video-final.mp4
          mkdir -p "$RUNNER_TEMP/out"
          cp "$D/video-final.mp4" "$RUNNER_TEMP/out/${{ steps.p.outputs.project }}.mp4"
          cd "$D" && zip -qr "$RUNNER_TEMP/out/${{ steps.p.outputs.project }}-audio.zip" audio || true

      - uses: actions/upload-artifact@v4
        if: steps.t.outputs.skip != '1'
        with:
          name: ${{ steps.p.outputs.project }}
          path: ${{ runner.temp }}/out/

      - name: Lưu video lên nhánh renders
        if: steps.t.outputs.skip != '1'
        run: |
          P=${{ steps.p.outputs.project }}
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          # nhiều phần dựng song song → thử lại khi push bị từ chối
          for i in 1 2 3 4 5 6 7 8; do
            if git ls-remote --exit-code origin renders >/dev/null 2>&1; then
              git fetch --depth 1 origin renders && git checkout -f -B renders FETCH_HEAD
            else
              git checkout -f --orphan renders && git rm -rf -q . || true
            fi
            mkdir -p videos
            cp "$RUNNER_TEMP/out/$P.mp4" "$RUNNER_TEMP/out/$P-audio.zip" videos/
            git add videos
            git commit -qm "Render $P"
            if git push origin renders; then exit 0; fi
            echo "push bị từ chối, thử lại lần $i"; sleep $((10 + RANDOM % 30))
          done
          exit 1

      - name: Lưu log khi lỗi
        if: failure()
        run: |
          P=${{ steps.p.outputs.project }}
          mkdir -p "$RUNNER_TEMP/keep"
          cp "$RUNNER_TEMP/run.log" "$RUNNER_TEMP/keep/$P.log" 2>/dev/null || echo "không có log" > "$RUNNER_TEMP/keep/$P.log"
          if ls "projects/$P/audio/"* >/dev/null 2>&1; then
            (cd "projects/$P" && zip -qr "$RUNNER_TEMP/keep/$P-audio-do-dang.zip" audio)
          fi
          git config user.name "video-bot"; git config user.email "video-bot@users.noreply.github.com"
          git checkout -f --orphan logs && git rm -rf -q . && git clean -fdq
          cp "$RUNNER_TEMP"/keep/* . && git add -A && git commit -qm "Log lỗi $P" && git push -f origin logs
