name: Voice samples (VieNeu-TTS)
on:
  workflow_dispatch:
    inputs:
      lines: {description: "tệp JSON {lines, voices} trong repo (bỏ trống = mặc định)", required: false, default: ""}
      tempo: {description: "các tốc độ thêm cho mỗi giọng, cách nhau bởi dấu cách (vd 1.15 1.25)", required: false, default: ""}
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài VieNeu-TTS
        run: |
          pip install -q vieneu soundfile numpy
          pip install -q "onnxruntime==1.22.1"
          pip list 2>/dev/null | grep -i -E "vieneu|onnx|torch"
      - name: Tạo giọng mẫu
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OUT: ${{ runner.temp }}/samples
          LINES_FILE: ${{ inputs.lines }}
        run: |
          set -o pipefail
          python engine/vieneu_samples.py 2>&1 | tee "$RUNNER_TEMP/vieneu.log"
          sudo apt-get install -y -qq ffmpeg >/dev/null
          cd "$OUT"
          for f in *.wav; do
            for t in ${{ inputs.tempo }}; do ffmpeg -loglevel error -y -i "$f" -af "atempo=$t" "${f%.wav}-x$t.wav"; done
          done
          for f in *.wav; do ffmpeg -loglevel error -y -i "$f" -af loudnorm=I=-16:TP=-1.5 -b:a 128k "${f%.wav}.mp3" && rm "$f"; done
      - name: Lưu lên nhánh samples-vieneu
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/samples"; cp "$RUNNER_TEMP/vieneu.log" "$RUNNER_TEMP/samples/" 2>/dev/null || true
          git config user.name "video-bot"; git config user.email "video-bot@users.noreply.github.com"
          git checkout -f --orphan samples-vieneu && git rm -rf -q . && git clean -fdq
          cp "$RUNNER_TEMP"/samples/* . && git add -A && git commit -qm "Giọng mẫu VieNeu" && git push -f origin samples-vieneu
